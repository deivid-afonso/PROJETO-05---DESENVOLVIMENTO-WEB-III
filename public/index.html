<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projeto 05 - Cálculo de Média (Node.js) | FATEC Diadema</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="card">
    <h1>Cálculo de Média Acadêmica — DWIII</h1>
    <p>Informe as notas <strong>P1</strong> e <strong>P2</strong> (0 a 10) para consultar a situação final via rota <code>/media?p1=...&amp;p2=...</code>.</p>

    <form action="/media" method="GET">
      <label for="p1">Nota P1:</label>
      <input type="number" id="p1" name="p1" step="0.1" min="0" max="10" placeholder="Ex: 7.5" required />

      <label for="p2">Nota P2:</label>
      <input type="number" id="p2" name="p2" step="0.1" min="0" max="10" placeholder="Ex: 5.0" required />

      <button type="submit" class="btn">Calcular Média</button>
    </form>

    <div class="links-rapidos">
      <strong>Exemplos de teste via URL:</strong>
      <a href="/media?p1=7.5&p2=5.0">/media?p1=7.5&amp;p2=5.0 (Média 6.25 — Aprovado)</a>
      <a href="/media?p1=4.0&p2=5.5">/media?p1=4.0&amp;p2=5.5 (Média 4.75 — Reprovado)</a>
      <a href="/media?p1=8.0">/media?p1=8.0 (Parâmetro ausente — Erro 400)</a>
    </div>
  </div>
</body>
</html>
