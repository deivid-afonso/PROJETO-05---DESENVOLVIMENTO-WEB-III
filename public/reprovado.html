<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aluno Reprovado | Projeto 05 DWIII</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="card">
    <span class="badge badge-reprovado">{{SITUACAO}}</span>
    <h1>Situação Final: Reprovado(a)</h1>
    <p>Sua média final ficou abaixo do critério mínimo exigido (Média &lt; 6.0).</p>

    <div class="notas-grid">
      <div class="nota-box">
        <span>Nota P1</span>
        <strong id="valP1">{{P1}}</strong>
      </div>
      <div class="nota-box">
        <span>Nota P2</span>
        <strong id="valP2">{{P2}}</strong>
      </div>
      <div class="nota-box">
        <span>Média Final</span>
        <strong id="valMedia" style="color: #f87171;">{{MEDIA}}</strong>
      </div>
    </div>

    <a href="/" class="btn">← Realizar Novo Cálculo</a>
  </div>
</body>
</html>
